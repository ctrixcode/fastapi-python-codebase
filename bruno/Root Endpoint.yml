docs: |-
  # Health Check
  Verifies the operational status of the FastAPI application.

  ## Response Examples

  ### Success (200 OK)
  ```json
  {
    "success": true,
    "data": {
      "message": "API is running"
    }
  }
  ```

  ### Error (500 Internal Server Error)
  ```json
  {
    "success": false,
    "err_code": "INTERNAL_SERVER_ERROR",
    "message": "Internal server error"
  }
  ```
