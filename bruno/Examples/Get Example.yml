docs: |-
  # Get Example
  Retrieves a single Example resource by its database ID.

  ## Response Examples

  ### Success (200 OK)
  ```json
  {
    "id": 1,
    "name": "dummy name",
    "description": "dummy description"
  }
  ```

  ### Error (404 Not Found)
  ```json
  {
    "success": false,
    "err_code": "NOT_FOUND",
    "message": "Example not found"
  }
  ```
