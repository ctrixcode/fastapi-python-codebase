info:
  name: Get All
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/examples/?skip=0&limit=100"
  params:
    - name: skip
      value: "0"
      type: query
    - name: limit
      value: "100"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get All Examples
  Retrieves a list of Example resources with pagination.

  ## Query Parameters
  - `skip` (default: 0): Number of records to skip.
  - `limit` (default: 100): Maximum number of records to return.

  ## Response Examples

  ### Success (200 OK)
  ```json
  [
    {
      "id": 1,
      "name": "dummy name",
      "description": "dummy description"
    }
  ]
  ```

  ### Error (500 Internal Server Error)
  ```json
  {
    "success": false,
    "err_code": "INTERNAL_SERVER_ERROR",
    "message": "Internal server error"
  }
  ```
