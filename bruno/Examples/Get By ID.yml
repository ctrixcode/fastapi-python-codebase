info:
  name: Get By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/examples/1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Example
  Retrieves a single Example resource by its database ID.

  ## Response Examples

  ### Success (200 OK)
  ```json
  {
    "id": 1,
    "name": "dummy name",
    "description": "dummy description"
  }
  ```

  ### Error (404 Not Found)
  ```json
  {
    "success": false,
    "err_code": "NOT_FOUND",
    "message": "Example not found"
  }
  ```
