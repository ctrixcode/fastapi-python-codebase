[project]
name = "fastapi-python-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "pre-commit>=4.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = "."


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
